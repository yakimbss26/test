<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사다리타기 🪜</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent1: #e94560;
    --accent2: #0f3460;
    --accent3: #ffc947;
    --accent4: #53d8fb;
    --text: #eaeaea;
    --text-dim: #8892a4;
    --rail: #2a3a5c;
    --rung: #3a4f7a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .grain {
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 999;
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1rem;
    position: relative;
  }

  h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    background: linear-gradient(135deg, var(--accent3), var(--accent1));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    margin-bottom: 0.3rem;
  }

  header p {
    color: var(--text-dim);
    font-size: 0.95rem;
  }

  .setup {
    max-width: 600px;
    margin: 1.5rem auto;
    padding: 0 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .setup-row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .setup label {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--accent4);
  }

  .count-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 2px solid var(--accent2);
    background: var(--surface);
    color: var(--text);
    font-size: 1.2rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
  }
  .count-btn:hover { border-color: var(--accent1); color: var(--accent1); }

  .count-display {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--accent3);
    min-width: 2rem;
    text-align: center;
  }

  .names-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }

  .names-grid input {
    padding: 0.55rem 0.75rem;
    border-radius: 10px;
    border: 2px solid var(--accent2);
    background: var(--surface);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .names-grid input:focus { border-color: var(--accent4); }
  .names-grid input::placeholder { color: var(--text-dim); }

  .action-btn {
    padding: 0.75rem 2.5rem;
    border-radius: 14px;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 900;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.25s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent1), #c0392b);
    color: #fff;
    box-shadow: 0 4px 20px rgba(233, 69, 96, 0.35);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(233, 69, 96, 0.5);
  }

  .btn-secondary {
    background: var(--accent2);
    color: var(--text);
  }
  .btn-secondary:hover {
    background: #1a4a8a;
    transform: translateY(-2px);
  }

  .btn-row {
    display: flex; gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }

  /* Canvas area */
  .game-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
  }

  canvas {
    border-radius: 16px;
    background: var(--surface);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    max-width: 100%;
  }

  .top-names, .bottom-results {
    display: flex;
    justify-content: space-around;
    max-width: 700px;
    width: 100%;
    margin: 0 auto;
  }

  .name-tag {
    text-align: center;
    cursor: pointer;
    padding: 0.5rem 0.25rem;
    border-radius: 12px;
    transition: all 0.25s;
    min-width: 60px;
    user-select: none;
  }
  .name-tag:hover { background: rgba(255,255,255,0.05); }
  .name-tag.active {
    background: rgba(233, 69, 96, 0.15);
    transform: scale(1.08);
  }

  .name-tag .label {
    font-weight: 900;
    font-size: 1rem;
    color: var(--accent3);
  }

  .name-tag .emoji { font-size: 1.5rem; }

  .result-tag {
    text-align: center;
    padding: 0.5rem 0.25rem;
    min-width: 60px;
  }
  .result-tag .label {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--accent4);
  }

  .result-tag.revealed .label {
    animation: pop 0.4s ease;
  }

  @keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .instructions {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 0.5rem;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .result-banner {
    text-align: center;
    margin: 1rem 0;
    font-size: 1.3rem;
    font-weight: 900;
    color: var(--accent3);
    min-height: 2rem;
  }

  .hidden { display: none !important; }

  @media (max-width: 500px) {
    .names-grid { grid-template-columns: 1fr; }
    canvas { width: 100% !important; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<header>
  <h1>🪜 사다리타기</h1>
  <p>이름을 클릭하면 사다리를 타고 내려갑니다!</p>
</header>

<!-- SETUP SCREEN -->
<div class="setup" id="setupScreen">
  <div class="setup-row">
    <label>참가자 수</label>
    <button class="count-btn" onclick="changeCount(-1)">−</button>
    <span class="count-display" id="countDisplay">4</span>
    <button class="count-btn" onclick="changeCount(1)">+</button>
  </div>

  <div>
    <label style="display:block;margin-bottom:0.4rem;">참가자 이름</label>
    <div class="names-grid" id="nameInputs"></div>
  </div>

  <div>
    <label style="display:block;margin-bottom:0.4rem;">결과 (당첨/벌칙 등)</label>
    <div class="names-grid" id="resultInputs"></div>
  </div>

  <div class="btn-row">
    <button class="action-btn btn-primary" onclick="startGame()">사다리 만들기 🎲</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="game-area hidden" id="gameScreen">
  <div class="top-names" id="topNames"></div>
  <canvas id="ladderCanvas"></canvas>
  <div class="bottom-results" id="bottomResults"></div>
  <p class="instructions" id="instrText">☝️ 위 이름을 클릭해서 사다리를 타세요!</p>
  <div class="result-banner" id="resultBanner"></div>
  <div class="btn-row">
    <button class="action-btn btn-secondary" onclick="resetGame()">다시 만들기 🔄</button>
    <button class="action-btn btn-secondary" onclick="goSetup()">설정으로 ⚙️</button>
  </div>
</div>

<script>
const PLAYER_COLORS = ['#e94560','#53d8fb','#ffc947','#2ecc71','#e67e22','#9b59b6','#1abc9c','#e74c3c'];
const EMOJIS = ['😀','😎','🤩','🥳','😺','🐶','🦊','🐸'];

let count = 4;
let names = [];
let results = [];
let rungs = []; // [{col, row}]
let revealed = new Set();
let animating = false;

// Setup
function changeCount(d) {
  count = Math.max(2, Math.min(8, count + d));
  document.getElementById('countDisplay').textContent = count;
  buildInputs();
}

function buildInputs() {
  const ng = document.getElementById('nameInputs');
  const rg = document.getElementById('resultInputs');
  ng.innerHTML = '';
  rg.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const ni = document.createElement('input');
    ni.placeholder = `참가자 ${i+1}`;
    ni.value = names[i] || '';
    ni.oninput = () => { names[i] = ni.value; };
    ng.appendChild(ni);

    const ri = document.createElement('input');
    ri.placeholder = `결과 ${i+1}`;
    ri.value = results[i] || '';
    ri.oninput = () => { results[i] = ri.value; };
    rg.appendChild(ri);
  }
}

buildInputs();

function startGame() {
  // Fill defaults
  for (let i = 0; i < count; i++) {
    if (!names[i]) names[i] = `참가자${i+1}`;
    if (!results[i]) results[i] = i === 0 ? '🎉 당첨!' : `결과${i+1}`;
  }
  names = names.slice(0, count);
  results = results.slice(0, count);

  // Shuffle results
  const shuffled = [...results];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  results = shuffled;

  generateRungs();
  revealed = new Set();
  animating = false;

  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('resultBanner').textContent = '';
  document.getElementById('instrText').classList.remove('hidden');

  renderTopNames();
  renderBottomResults();
  drawLadder();
}

function generateRungs() {
  rungs = [];
  const rows = 12;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < count - 1; c++) {
      if (Math.random() < 0.45) {
        // Avoid adjacent rungs in same row
        if (rungs.length > 0) {
          const last = rungs[rungs.length - 1];
          if (last.row === r && last.col === c - 1) continue;
        }
        rungs.push({ col: c, row: r });
      }
    }
  }
  // Ensure at least 1 rung per column gap
  for (let c = 0; c < count - 1; c++) {
    if (!rungs.some(r => r.col === c)) {
      rungs.push({ col: c, row: Math.floor(Math.random() * rows) });
    }
  }
}

function renderTopNames() {
  const el = document.getElementById('topNames');
  el.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const tag = document.createElement('div');
    tag.className = 'name-tag';
    tag.innerHTML = `<div class="emoji">${EMOJIS[i % EMOJIS.length]}</div><div class="label">${names[i]}</div>`;
    tag.onclick = () => animateLadder(i);
    el.appendChild(tag);
  }
}

function renderBottomResults() {
  const el = document.getElementById('bottomResults');
  el.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const tag = document.createElement('div');
    tag.className = 'result-tag';
    tag.id = `res-${i}`;
    tag.innerHTML = `<div class="label">???</div>`;
    el.appendChild(tag);
  }
}

function getCanvasSize() {
  const w = Math.min(700, window.innerWidth - 32);
  const h = 420;
  return { w, h };
}

function getLadderGeometry() {
  const { w, h } = getCanvasSize();
  const padX = 50;
  const padTop = 20;
  const padBot = 20;
  const colW = (w - padX * 2) / (count - 1);
  const rows = 12;
  const rowH = (h - padTop - padBot) / (rows + 1);
  return { w, h, padX, padTop, padBot, colW, rows, rowH };
}

function drawLadder(highlights = []) {
  const canvas = document.getElementById('ladderCanvas');
  const { w, h, padX, padTop, colW, rows, rowH } = getLadderGeometry();
  canvas.width = w * 2; canvas.height = h * 2;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);

  // Background
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, w, h);

  // Rails
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#2a3a5c';
  for (let i = 0; i < count; i++) {
    const x = padX + i * colW;
    ctx.beginPath();
    ctx.moveTo(x, padTop);
    ctx.lineTo(x, h - 20);
    ctx.stroke();
  }

  // Rungs
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#3a4f7a';
  for (const rung of rungs) {
    const x1 = padX + rung.col * colW;
    const x2 = padX + (rung.col + 1) * colW;
    const y = padTop + (rung.row + 1) * rowH;
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.stroke();
  }

  // Highlights
  for (const hl of highlights) {
    ctx.lineWidth = 4;
    ctx.strokeStyle = hl.color;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hl.x1, hl.y1);
    ctx.lineTo(hl.x2, hl.y2);
    ctx.stroke();
  }
}

function tracePath(startCol) {
  const { padX, padTop, colW, rows, rowH } = getLadderGeometry();
  let col = startCol;
  const path = [];
  let x = padX + col * colW;
  let y = padTop;
  path.push({ x, y });

  for (let r = 0; r < rows; r++) {
    const nextY = padTop + (r + 1) * rowH;
    // Move down
    path.push({ x, y: nextY, type: 'down' });
    y = nextY;

    // Check rung right
    const rungRight = rungs.find(rn => rn.col === col && rn.row === r);
    if (rungRight) {
      const nx = padX + (col + 1) * colW;
      path.push({ x: nx, y, type: 'right' });
      x = nx;
      col++;
      continue;
    }
    // Check rung left
    const rungLeft = rungs.find(rn => rn.col === col - 1 && rn.row === r);
    if (rungLeft) {
      const nx = padX + (col - 1) * colW;
      path.push({ x: nx, y, type: 'left' });
      x = nx;
      col--;
    }
  }
  // Final drop
  const finalY = padTop + (rows + 1) * rowH;
  path.push({ x, y: finalY, type: 'down' });

  return { path, endCol: col };
}

function animateLadder(startCol) {
  if (animating) return;
  animating = true;

  // Mark active
  const tags = document.querySelectorAll('.name-tag');
  tags.forEach(t => t.classList.remove('active'));
  tags[startCol].classList.add('active');

  const color = PLAYER_COLORS[startCol % PLAYER_COLORS.length];
  const { path, endCol } = tracePath(startCol);
  const segments = [];

  for (let i = 0; i < path.length - 1; i++) {
    segments.push({
      x1: path[i].x, y1: path[i].y,
      x2: path[i+1].x, y2: path[i+1].y,
      color
    });
  }

  let drawn = [];
  let idx = 0;

  function step() {
    if (idx < segments.length) {
      drawn.push(segments[idx]);
      drawLadder(drawn);
      idx++;
      setTimeout(step, 80);
    } else {
      // Reveal result
      const resEl = document.getElementById(`res-${endCol}`);
      resEl.querySelector('.label').textContent = results[endCol];
      resEl.classList.add('revealed');
      revealed.add(endCol);

      document.getElementById('resultBanner').textContent =
        `${names[startCol]} → ${results[endCol]}`;

      if (revealed.size === count) {
        document.getElementById('instrText').classList.add('hidden');
      }
      animating = false;
    }
  }
  step();
}

function resetGame() {
  revealed = new Set();
  animating = false;
  generateRungs();
  renderTopNames();
  renderBottomResults();
  drawLadder();
  document.getElementById('resultBanner').textContent = '';
  document.getElementById('instrText').classList.remove('hidden');

  // Re-shuffle results
  for (let i = results.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [results[i], results[j]] = [results[j], results[i]];
  }
}

function goSetup() {
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('setupScreen').classList.remove('hidden');
  buildInputs();
}

window.addEventListener('resize', () => {
  if (!document.getElementById('gameScreen').classList.contains('hidden')) {
    drawLadder();
  }
});
</script>
</body>
</html>
